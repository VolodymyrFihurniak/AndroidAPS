name: Trigger target AAPS build once

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[one-shot] build 3.4.2.6+aisf3.2.1 fullRelease'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch AAPS CI fullRelease on target branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/aaps-ci.yml/dispatches" \
            -d '{"ref":"3.4.2.6+aisf3.2.1","inputs":{"buildVariant":"fullRelease"}}'
